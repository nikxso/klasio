# ==============================================================================
# Attendly - Staging Deployment Docker Compose
# Orchestrates PostgreSQL 16, isolated one-shot Alembic migration,
# FastAPI application (non-root), and Nginx reverse proxy with TLS & rate limiting.
# ==============================================================================

name: attendly_staging

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Isolated to internal container network)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: attendly_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atten_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atten_password}
      POSTGRES_DB: ${POSTGRES_DB:-atten_staging_db}
    volumes:
      - staging_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atten_user} -d ${POSTGRES_DB:-atten_staging_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - staging_internal

  # ----------------------------------------------------------------------------
  # 2. One-Shot Alembic Migration Runner (Prevents concurrent migration race)
  # ----------------------------------------------------------------------------
  migration:
    image: localhost/atten-backend:staging
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendly_staging_migration
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-atten_user}:${POSTGRES_PASSWORD:-atten_password}@db:5432/${POSTGRES_DB:-atten_staging_db}}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - staging_internal

  # ----------------------------------------------------------------------------
  # 3. FastAPI Application Backend (Runs as non-root user appuser)
  # ----------------------------------------------------------------------------
  api:
    image: localhost/atten-backend:staging
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendly_staging_api
    restart: unless-stopped
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DEBUG: ${DEBUG:-false}
      APP_NAME: ${APP_NAME:-Automated Student Attendance API (Staging)}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-atten_user}:${POSTGRES_PASSWORD:-atten_password}@db:5432/${POSTGRES_DB:-atten_staging_db}}
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ATTENDANCE_CORRECTION_WINDOW_DAYS: ${ATTENDANCE_CORRECTION_WINDOW_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    networks:
      - staging_internal

  # ----------------------------------------------------------------------------
  # 4. Nginx Reverse Proxy & TLS Termination
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: attendly_staging_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,z
      - ./nginx/ssl:/etc/nginx/ssl:ro,z
    depends_on:
      api:
        condition: service_healthy
    networks:
      - staging_internal
      - staging_public

networks:
  staging_internal:
    driver: bridge
  staging_public:
    driver: bridge

volumes:
  staging_pg_data:
