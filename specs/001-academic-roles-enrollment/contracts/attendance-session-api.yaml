openapi: 3.0.3
info:
  title: Automated Student Attendance System - Academic Roles, Scoping, and Attendance API
  version: 1.0.0
  description: >
    API contracts for feature 001-academic-roles-enrollment.
    Enforces role vs scope decoupling, teaching assignments, substitute delegation,
    effective-date student enrollments, multi-session-per-day, and audited corrections.
paths:

  /api/v1/auth/login:
    post:
      summary: Authenticate user and issue JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated; returns JWT access token and user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid username or password

  /api/v1/auth/me:
    get:
      summary: Retrieve authenticated user profile and academic authorization scopes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContextResponse'

  /api/v1/faculty/assignments:
    get:
      summary: Retrieve all teaching assignments and active delegations for the authenticated faculty
      security:
        - BearerAuth: []
      parameters:
        - name: academic_term_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of accessible teaching assignments (permanent and delegated)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacultyTeachingAssignment'
        '403':
          description: User lacks Faculty role

  /api/v1/faculty/assignments/{teaching_assignment_id}/roster:
    get:
      summary: Retrieve student attendance roster for an assignment on a specific academic date
      security:
        - BearerAuth: []
      parameters:
        - name: teaching_assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: session_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Eligible student roster with face registration readiness indicators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRosterResponse'
        '403':
          description: Faculty lacks authorization scope for this assignment on the specified date

  /api/v1/faculty/assignments/{teaching_assignment_id}/gallery:
    get:
      summary: Retrieve authorized student biometric templates for a teaching assignment
      security:
        - BearerAuth: []
      parameters:
        - name: teaching_assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: session_date
          in: query
          required: false
          schema:
            type: string
            format: date
            nullable: true
      responses:
        '200':
          description: Authorized face biometric gallery for the teaching assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentGalleryResponse'
        '403':
          description: Faculty lacks authorization scope for this assignment
        '404':
          description: Teaching assignment not found

  /api/v1/faculty/assignments/{teaching_assignment_id}/delegations:
    post:
      summary: Create a direct substitute faculty delegation
      security:
        - BearerAuth: []
      parameters:
        - name: teaching_assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDelegationRequest'
      responses:
        '201':
          description: Delegation created and activated immediately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstituteDelegationResponse'
        '400':
          description: Invalid date range or self-delegation attempt
        '403':
          description: User is not the assigned regular faculty or admin

  /api/v1/faculty/delegations/{delegation_id}/revoke:
    post:
      summary: Early revocation of an active substitute delegation
      security:
        - BearerAuth: []
      parameters:
        - name: delegation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeDelegationRequest'
      responses:
        '200':
          description: Delegation successfully revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstituteDelegationResponse'
        '403':
          description: Unauthorized to revoke delegation

  /api/v1/admin/departments:
    post:
      summary: Create an academic department
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        '201':
          description: Department successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        '403':
          description: Admin privileges required

  /api/v1/admin/terms:
    post:
      summary: Create an academic term
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTermCreate'
      responses:
        '201':
          description: Academic term successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTermResponse'
        '403':
          description: Admin privileges required

  /api/v1/admin/subjects:
    post:
      summary: Create an academic subject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreate'
      responses:
        '201':
          description: Subject successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '403':
          description: Admin privileges required

  /api/v1/admin/sections:
    post:
      summary: Create a class section
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassSectionCreate'
      responses:
        '201':
          description: Class section successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSectionResponse'
        '403':
          description: Admin privileges required

  /api/v1/admin/assignments:
    post:
      summary: Create a faculty teaching assignment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeachingAssignmentCreate'
      responses:
        '201':
          description: Teaching assignment successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingAssignmentResponse'
        '403':
          description: Admin privileges required

  /api/v1/admin/enrollments:
    post:
      summary: Enroll a student into a class section with effective date boundary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentEnrollmentCreate'
      responses:
        '201':
          description: Student successfully enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentResponse'
        '400':
          description: Overlapping active enrollment or invalid date range
        '403':
          description: Admin privileges required

  /api/v1/admin/enrollments/transfer:
    post:
      summary: Transfer student to a new section with date-bounded lifecycle
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentTransferRequest'
      responses:
        '200':
          description: Student successfully transferred to target section
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTransferResponse'
        '400':
          description: Invalid transfer date or same-section transfer
        '403':
          description: Admin privileges required

  /api/v1/attendance/sessions:
    post:
      summary: Submit and finalize an attendance session
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAttendanceSessionRequest'
      responses:
        '201':
          description: Attendance session finalized and recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSyncResponse'
        '400':
          description: Invariant violation (duplicate session slot, ineligible students included)
        '403':
          description: Conducting faculty lacks authorization for this offering/date

  /api/v1/attendance/sessions/sync:
    post:
      summary: Idempotent batch synchronization of offline finalized sessions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/BatchSyncRequest'
                - $ref: '#/components/schemas/SubmitAttendanceSessionRequest'
      responses:
        '200':
          description: Sync results per session (ACK / duplicate / error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSyncResponse'

  /api/v1/attendance/sessions/{session_id}/amendments:
    post:
      summary: Amend attendance record for an enrolled student (audited)
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAmendmentRequest'
      responses:
        '201':
          description: Amendment recorded and audit entry logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmendmentAuditResponse'
        '400':
          description: Invalid transition or empty justification
        '403':
          description: Correction window exceeded (Assigned regular faculty locked after configured window, default 7 days; requires Admin) or user lacks amendment authority (substitute faculty excluded)
    get:
      summary: Retrieve immutable amendment audit history for an attendance session
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chronological list of amendment audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AmendmentAuditResponse'
        '403':
          description: Unauthorized role

  /api/v1/student/attendance:
    get:
      summary: Retrieve personal attendance history and metrics for the authenticated student
      security:
        - BearerAuth: []
      parameters:
        - name: academic_term_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Student's personal attendance summary by subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPersonalAttendanceResponse'
        '403':
          description: Students cannot query data outside their own identity

  /api/v1/student/subjects/{teaching_assignment_id}/history:
    get:
      summary: Retrieve chronological attendance history for a specific subject/teaching assignment
      security:
        - BearerAuth: []
      parameters:
        - name: teaching_assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSubjectHistoryResponse'
        '403':
          description: Unauthorized role
        '404':
          description: Student not enrolled or assignment not found

  /api/v1/analytics/overview:
    get:
      summary: Retrieve attendance analytics overview
      security:
        - BearerAuth: []
      parameters:
        - name: academic_term_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
        - name: threshold
          in: query
          required: false
          schema:
            type: number
            minimum: 1.0
            maximum: 100.0
            default: 75.0
        - name: consecutive_absent_threshold
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 2
      responses:
        '200':
          description: Aggregated attendance overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverviewResponse'

  /api/v1/analytics/assignments/{teaching_assignment_id}:
    get:
      summary: Retrieve detailed section attendance analytics
      security:
        - BearerAuth: []
      parameters:
        - name: teaching_assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: threshold
          in: query
          required: false
          schema:
            type: number
            minimum: 1.0
            maximum: 100.0
            default: 75.0
        - name: consecutive_absent_threshold
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 2
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
            nullable: true
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
            nullable: true
      responses:
        '200':
          description: Detailed section attendance metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionAnalyticsResponse'
        '403':
          description: Students forbidden or faculty outside active assignment/delegation
        '404':
          description: Teaching assignment not found

  /api/v1/analytics/assignments/{teaching_assignment_id}/export:
    get:
      summary: Export section attendance report to CSV
      security:
        - BearerAuth: []
      parameters:
        - name: teaching_assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: report_type
          in: query
          required: false
          schema:
            type: string
            pattern: "^(roster|sessions)$"
            default: roster
        - name: threshold
          in: query
          required: false
          schema:
            type: number
            minimum: 1.0
            maximum: 100.0
            default: 75.0
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
            nullable: true
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
            nullable: true
        - name: shortage_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Section attendance report in CSV format
          content:
            text/csv:
              schema:
                type: string
        '403':
          description: Students forbidden or faculty outside active assignment/delegation
        '404':
          description: Teaching assignment not found

  /api/v1/analytics/overview/export:
    get:
      summary: Export institutional or faculty attendance overview to CSV
      security:
        - BearerAuth: []
      parameters:
        - name: academic_term_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
        - name: threshold
          in: query
          required: false
          schema:
            type: number
            minimum: 1.0
            maximum: 100.0
            default: 75.0
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
            nullable: true
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
            nullable: true
      responses:
        '200':
          description: Attendance overview report in CSV format
          content:
            text/csv:
              schema:
                type: string
        '403':
          description: Students forbidden or faculty outside active assignment/delegation

  /api/v1/biometrics/enrollment:
    post:
      summary: Enroll or re-enroll a student face biometric template
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceEnrollmentRequest'
      responses:
        '200':
          description: Successful face profile enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceEnrollmentResponse'
        '400':
          description: Biometric validation failed (dimension, quality, samples, or normalization)
        '403':
          description: Operator lacks authorization to enroll student
        '404':
          description: Student not found

  /api/v1/biometrics/revoke:
    post:
      summary: Revoke a student face biometric template
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceRevocationRequest'
      responses:
        '200':
          description: Successful face profile revocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceRevocationResponse'
        '403':
          description: Operator lacks authorization to revoke student enrollment
        '404':
          description: Student not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRole:
      type: string
      enum: [ADMIN, FACULTY, STUDENT]

    FaceRegistrationState:
      type: string
      enum: [UNREGISTERED, PENDING, REGISTERED]

    FaceRegistrationStatus:
      type: string
      enum: [UNREGISTERED, PENDING, REGISTERED, VALIDATION_FAILED]

    FaceEnrollmentRequest:
      type: object
      required:
        - student_user_id
        - active_model_version
        - embedding_dimension
        - sample_count
        - quality_score
      properties:
        student_user_id:
          type: string
          format: uuid
        active_model_version:
          type: string
          minLength: 1
          maxLength: 64
        embedding_dimension:
          type: integer
        sample_count:
          type: integer
          minimum: 1
        embedding_base64:
          type: string
        embeddings_base64:
          type: array
          items:
            type: string
        quality_score:
          type: number
          minimum: 0.0
          maximum: 1.0

    FaceEnrollmentResponse:
      type: object
      required:
        - profile_id
        - student_user_id
        - registration_state
        - active_model_version
        - embedding_dimension
        - sample_count
        - quality_score
        - enrolled_at
      properties:
        profile_id:
          type: string
          format: uuid
        student_user_id:
          type: string
          format: uuid
        registration_state:
          $ref: '#/components/schemas/FaceRegistrationStatus'
        active_model_version:
          type: string
        embedding_dimension:
          type: integer
        sample_count:
          type: integer
        quality_score:
          type: number
        enrolled_at:
          type: string
          format: date-time
        is_re_enrollment:
          type: boolean
          default: false

    FaceRevocationRequest:
      type: object
      required:
        - student_user_id
        - revocation_reason
      properties:
        student_user_id:
          type: string
          format: uuid
        revocation_reason:
          type: string
          minLength: 3
          maxLength: 500

    FaceRevocationResponse:
      type: object
      required:
        - student_user_id
        - registration_state
        - revoked_at
        - revocation_reason
      properties:
        student_user_id:
          type: string
          format: uuid
        registration_state:
          $ref: '#/components/schemas/FaceRegistrationStatus'
        revoked_at:
          type: string
          format: date-time
        revocation_reason:
          type: string

    GalleryStudentTemplate:
      type: object
      required:
        - student_user_id
        - institutional_id
        - student_name
        - embedding_base64
        - model_version
        - quality_score
        - updated_at
      properties:
        student_user_id:
          type: string
          format: uuid
        institutional_id:
          type: string
        student_name:
          type: string
        embedding_base64:
          type: string
        sample_index:
          type: integer
        model_version:
          type: string
        quality_score:
          type: number
        updated_at:
          type: string
          format: date-time

    AssignmentGalleryResponse:
      type: object
      required:
        - teaching_assignment_id
        - class_section_id
        - academic_term_id
        - gallery_version
        - template_count
        - templates
      properties:
        teaching_assignment_id:
          type: string
          format: uuid
        class_section_id:
          type: string
          format: uuid
        academic_term_id:
          type: string
          format: uuid
        gallery_version:
          type: string
        template_count:
          type: integer
        templates:
          type: array
          items:
            $ref: '#/components/schemas/GalleryStudentTemplate'

    SessionApplicability:
      type: string
      enum: [COUNTED, CANCELLED, EXEMPT]

    AttendanceStatus:
      type: string
      enum: [PRESENT, ABSENT, EXCUSED]

    MarkSource:
      type: string
      enum: [AI_VERIFIED, MANUAL_MARK, MANUAL_OVERRIDE]

    UserContextResponse:
      type: object
      required:
        - id
        - institutional_id
        - email
        - full_name
        - role
      properties:
        id:
          type: string
          format: uuid
        institutional_id:
          type: string
        email:
          type: string
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        face_registration_state:
          $ref: '#/components/schemas/FaceRegistrationState'

    FacultyTeachingAssignment:
      type: object
      required:
        - teaching_assignment_id
        - class_section_id
        - section_code
        - subject_id
        - subject_code
        - subject_name
        - academic_term_id
        - term_name
      properties:
        teaching_assignment_id:
          type: string
          format: uuid
        class_section_id:
          type: string
          format: uuid
        section_code:
          type: string
        subject_id:
          type: string
          format: uuid
        subject_code:
          type: string
        subject_name:
          type: string
        academic_term_id:
          type: string
          format: uuid
        term_name:
          type: string
        is_delegated:
          type: boolean
          default: false
        delegation_details:
          $ref: '#/components/schemas/DelegationDetails'
          nullable: true

    RosterStudentItem:
      type: object
      required:
        - student_user_id
        - institutional_id
        - student_name
        - effective_start_date
      properties:
        student_user_id:
          type: string
          format: uuid
        institutional_id:
          type: string
        student_name:
          type: string
        effective_start_date:
          type: string
          format: date
        face_registration_state:
          $ref: '#/components/schemas/FaceRegistrationState'

    ClassRosterResponse:
      type: object
      required:
        - teaching_assignment_id
        - session_date
        - eligible_students
        - total_eligible_count
      properties:
        teaching_assignment_id:
          type: string
          format: uuid
        session_date:
          type: string
          format: date
        eligible_students:
          type: array
          items:
            $ref: '#/components/schemas/RosterStudentItem'
        total_eligible_count:
          type: integer

    CreateDelegationRequest:
      type: object
      required:
        - substitute_faculty_user_id
        - start_date
        - end_date
        - delegation_reason
      properties:
        substitute_faculty_user_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        delegation_reason:
          type: string
          minLength: 5

    SubstituteDelegation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teaching_assignment_id:
          type: string
          format: uuid
        regular_faculty_user_id:
          type: string
          format: uuid
        substitute_faculty_user_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        delegation_reason:
          type: string
        status:
          type: string
          enum: [ACTIVE, EXPIRED, REVOKED]
        created_at:
          type: string
          format: date-time

    CreateEnrollmentRequest:
      type: object
      required:
        - student_user_id
        - class_section_id
        - academic_term_id
        - effective_start_date
      properties:
        student_user_id:
          type: string
          format: uuid
        class_section_id:
          type: string
          format: uuid
        academic_term_id:
