services:
  db:
    image: postgres:16-alpine
    container_name: atten_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atten_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atten_password}
      POSTGRES_DB: ${POSTGRES_DB:-atten_db}
    ports:
      - "5432:5432"
    volumes:
      - atten_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atten_user} -d ${POSTGRES_DB:-atten_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  atten_pg_data:
