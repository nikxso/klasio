name: Deploy Backend to Azure Linux VM

on:
  push:
    branches: [main, master, staging]
    paths:
      - 'backend/**'
      - 'docker-compose.staging.yml'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-container:
    name: Build & Push Backend Container to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/nikxso/klasio-backend:latest
            ghcr.io/nikxso/klasio-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vm:
    name: Deploy to Azure VM via SSH
    runs-on: ubuntu-latest
    needs: build-and-push-container
    if: vars.AZURE_VM_HOST != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.AZURE_VM_HOST || secrets.AZURE_VM_HOST || '20.244.48.12' }}
          username: ${{ vars.AZURE_VM_USERNAME || secrets.AZURE_VM_USERNAME || 'deploy' }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          port: ${{ vars.AZURE_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            PROJECT_DIR="${{ vars.AZURE_PROJECT_PATH || '/home/deploy/klasio' }}"
            echo "==> Deploying Klasio isolated stack to Azure VM at $PROJECT_DIR..."
            
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            echo "==> Pulling latest image from GHCR..."
            docker compose -p klasio -f docker-compose.staging.yml pull

            echo "==> Launching isolated Klasio Docker Compose stack..."
            docker compose -p klasio -f docker-compose.staging.yml up -d --remove-orphans

            echo "==> Verifying isolated backend health..."
            sleep 6
            docker compose -p klasio -f docker-compose.staging.yml ps
            curl -f http://127.0.0.1:8000/docs > /dev/null && echo "Klasio backend is healthy and responding on port 8000!"
