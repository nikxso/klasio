name: Build Android Release APK

on:
  push:
    branches: [main, master, staging]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      apiUrl:
        description: 'Backend Server URL (e.g. https://payment-adaptor-pottery-answered.trycloudflare.com)'
        required: false
        default: 'https://payment-adaptor-pottery-answered.trycloudflare.com'
  release:
    types: [published]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Universal Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate Android Native Project (Expo Prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Compile Universal Release APK with Gradle
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.apiUrl || vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL || 'https://payment-adaptor-pottery-answered.trycloudflare.com' }}
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1536m -Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError\""
        run: |
          sed -i 's/-XX:MaxMetaspaceSize=[0-9]*m/-XX:MaxMetaspaceSize=1536m/g' gradle.properties || true
          sed -i 's/-Xmx[0-9]*m/-Xmx4096m/g' gradle.properties || true
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Organize Release Artifacts
        working-directory: mobile/android/app/build/outputs/apk/release
        run: |
          cp app-release.apk klasio-release.apk || true

      - name: Upload Release APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klasio-universal-release-apk
          path: mobile/android/app/build/outputs/apk/release/klasio-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (Tag Triggers Only)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/release/klasio-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
